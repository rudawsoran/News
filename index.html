<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sonar System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix"></script>
    <style>
        body { margin: 0; background: black; color: cyan; font-family: sans-serif; overflow: hidden; }
        #status { position: absolute; top: 10px; width: 100%; text-align: center; z-index: 10; font-size: 14px; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div id="status">Loading AI Model...</div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
    // کۆدەکەی تۆ لێرەدا دەست پێ دەکات
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    async function setupCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' }, 
                audio: false 
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    resolve(video);
                };
            });
        } catch (e) {
            alert("Error: " + e.message);
        }
    }

    async function startDetection() {
        const net = await bodyPix.load({
            architecture: 'MobileNetV1',
            outputStride: 16,
            multiplier: 0.50,
            quantBytes: 2
        });
        
        document.getElementById('status').innerText = "SYSTEM ACTIVE - SCANNING";
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        async function detect() {
            const segmentation = await net.segmentPerson(video);
            const maskColor = { r: 0, g: 255, b: 255, a: 150 };
            const background = { r: 0, g: 0, b: 0, a: 0 };
            const coloredPartImage = bodyPix.toMask(segmentation, maskColor, background);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            bodyPix.drawMask(canvas, video, coloredPartImage, 0.7, 0, false);
            requestAnimationFrame(detect);
        }
        detect();
    }

    setupCamera().then(startDetection);
</script>

</body>
</html>
